<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MICRO PLASTICS PRIVATE LIMITED – Training Portal</title>
<style>
:root{--navy:#0b2545;--teal:#13a89e;--bg:#f4f7fa;--card:#fff;--tx:#1b2733;--mu:#667785;--bd:#dde5ec;--ok:#1e9e5a;--er:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer}.btn{background:var(--teal);color:#fff;border:0;padding:10px 18px;border-radius:8px;font-weight:600}.btn:hover{filter:brightness(.93)}.btn:disabled{background:#b9c4cc;cursor:not-allowed}
.btn.s{background:#fff;color:var(--navy);border:1px solid var(--bd)}.btn.d{background:var(--er)}.btn.sm{padding:5px 10px;font-size:12px}
input,textarea,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin:4px 0 12px;background:#fff}
label.l{font-size:13px;font-weight:600;color:var(--mu)}
header{background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px}.logo i{width:34px;height:34px;border-radius:50%;background:var(--teal);display:grid;place-items:center;font-style:normal;color:#fff}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}.hero{background:linear-gradient(150deg,var(--navy),#134e6f);color:#fff;padding:60px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:34px;margin:18px 0 8px}.hero p{opacity:.85;max-width:420px;line-height:1.6}.hero li{margin:8px 0;opacity:.9}
.lbox{display:flex;align-items:center;justify-content:center;padding:30px}.lbox form{width:100%;max-width:360px;background:var(--card);padding:32px;border-radius:14px;box-shadow:0 8px 30px #0b25451a}
.err{color:var(--er);font-size:13px;min-height:18px;margin-bottom:8px}
.wrap{display:grid;grid-template-columns:300px 1fr;gap:20px;max-width:1200px;margin:20px auto;padding:0 16px}
.side,.main{background:var(--card);border-radius:12px;border:1px solid var(--bd);padding:18px}
.bar{height:8px;background:#e6edf2;border-radius:6px;overflow:hidden;margin:8px 0 16px}.bar b{display:block;height:100%;background:var(--teal)}
.item{display:flex;gap:10px;align-items:center;padding:11px 10px;border-radius:8px;cursor:pointer;font-size:14px;border:1px solid transparent}
.item:hover{background:var(--bg)}.item.on{background:#e8f7f6;border-color:var(--teal)}.item.lk{opacity:.45;cursor:not-allowed}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;font-size:11px;flex:none}.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
video,iframe.v{width:100%;aspect-ratio:16/9;border-radius:10px;background:#000;border:0}
.mu{color:var(--mu);font-size:14px}.q{border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}.q label{display:block;padding:6px 0;cursor:pointer}.q input[type=radio]{width:auto;margin:0 8px 0 0}
.timer{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border-radius:10px;padding:12px 16px;margin:12px 0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}.card b{font-size:28px;display:block;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}th{background:var(--bg)}
.tag{padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600}.t1{background:#dff5e9;color:var(--ok)}.t2{background:#fff3d6;color:#a46b00}.t3{background:#eef1f4;color:var(--mu)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--bd);background:#fff;padding:9px 16px;border-radius:8px;font-weight:600;color:var(--navy)}.tabs button.on{background:var(--navy);color:#fff}
.ed{border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0;background:#fcfdfe}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cert{border:10px double var(--navy);padding:36px;text-align:center;background:#fff}.cert img{max-height:70px;margin-bottom:6px}.cert h1{font-family:Georgia,serif;font-size:36px;margin:8px 0}.cert h2{font-family:Georgia,serif;font-size:30px;border-bottom:2px solid var(--teal);display:inline-block;padding:0 24px 4px;margin:10px 0}
.cert .org{font-weight:700;letter-spacing:1px}.cert .sg{margin:34px auto 10px;width:240px;border-top:1px solid #333;padding-top:6px;font-size:14px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:8px;z-index:9}
@media(max-width:800px){.login,.wrap,.g2{grid-template-columns:1fr}.hero{padding:30px}.cards{grid-template-columns:1fr 1fr}}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* Default content. Everything below can be edited from the Admin login (Sections / Questions / Certificate tabs). */
const DEF={course:"Plastics Safety & Quality Induction",passMark:70,
 sections:[
  {id:"s1",title:"Introduction to Plastics & Microplastics",desc:"Company overview and polymer types.",src:"",mins:5},
  {id:"s2",title:"Workplace Safety & PPE",desc:"Hazards, PPE and emergency response.",src:"",mins:5}],
 questions:[
  {q:"What is the primary purpose of PPE?",o:["Looks professional","Protects workers from hazards","Reduces production time","Marks seniority"],a:1},
  {q:"Microplastics are generally smaller than:",o:["5 mm","5 cm","50 cm","1 m"],a:0}],
 cert:{org:"MICRO PLASTICS PRIVATE LIMITED",title:"Certificate of Completion",sub:"This is to certify that",body:"has successfully completed the training programme {course} with a score of {score}%.",sign:"Authorised Signatory",desig:"Head – HR & Training",footer:"This certificate is system generated and can be verified using the Certificate ID.",color:"#0b2545",logo:""}};
const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
/* Data layer – swap these for Firebase/Supabase to share data across devices */
const C=()=>{const s=J('mp_cfg',{});return{...DEF,...s,cert:{...DEF.cert,...(s.cert||{})}}},U=()=>USERS,P=()=>J('mp_prog',{});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function H(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('mpl|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
let USERS={},CSVERR='';
/* ===== SYNC: paste your Google Apps Script Web App URL between the quotes (see setup steps) ===== */
const SYNC='https://script.google.com/macros/s/AKfycbx5SqMo2hrgbv0EEpWTBCJMuRGVZG-UK5FOSqgz4NAFYlZMACqZMPTGWVqBSb3UGnYa/exec';
async function api(m,b){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),12000);try{const o=m==='GET'?{signal:ac.signal}:{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),signal:ac.signal};const r=await fetch(m==='GET'?SYNC+'?'+new URLSearchParams(b):SYNC,o);return await r.json()}finally{clearTimeout(tm)}}
function akey(){return sessionStorage.getItem('mp_k')||null}
function saveKey(){const v=(document.getElementById('akin')||{}).value;if(!v||!v.trim())return toast('Enter the key');sessionStorage.setItem('mp_k',v.trim());S.all=null;render()}
async function pullProg(){if(!SYNC||!S.u||USERS[S.u]?.role==='admin')return;
 try{const r=await api('GET',{a:'prog',u:S.u});if(r&&r.done){const a=P(),l=a[S.u]||{done:{}};if((r.retrain||0)>(l.retrain||0)){a[S.u]=r;localStorage.setItem('mp_prog',JSON.stringify(a));return}const m={...l,...r};m.history=r.history||l.history;m.done={...r.done,...l.done};m.watch={...(r.watch||{}),...(l.watch||{})};
  const t={};[...(l.tries||[]),...(r.tries||[])].forEach(x=>t[x.date]=x);m.tries=Object.values(t);m.cert=l.cert||r.cert;a[S.u]=m;localStorage.setItem('mp_prog',JSON.stringify(a))}}catch(e){}}
let pt, syncBusy=false, syncAgain=false;
function setSync(ok){let b=document.getElementById('syncb');if(!b){b=document.createElement('div');b.id='syncb';b.style.cssText='position:fixed;right:10px;bottom:10px;padding:6px 12px;border-radius:14px;font:600 12px sans-serif;z-index:99;color:#fff';document.body.append(b)}
 if(!S.u||USERS[S.u]?.role==='admin'){b.style.display='none';return}b.style.display='block';b.textContent=ok?'Synced ✓':'Not synced – retrying…';b.style.background=ok?'#1a7f4b':'#c0392b'}
function flushDirty(){if(SYNC&&S.u&&localStorage.getItem('mp_dirty')===S.u&&!syncBusy)pushProg()}
function pushProg(){
 if(!SYNC||!S.u||USERS[S.u]?.role==='admin')return;
 localStorage.setItem('mp_dirty',S.u);setSync(false);
 clearTimeout(pt);
 pt=setTimeout(async()=>{
  if(syncBusy){syncAgain=true;return} syncBusy=true;
  try{const r=await api('POST',{a:'prog',u:S.u,d:P()[S.u]});if(r&&r.error)toast('Sync rejected – please contact Admin');else{if(r&&r.stale)await pullProg();localStorage.removeItem('mp_dirty');setSync(true)}}
  catch(e){setSync(false)}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;pushProg()}}
 },150);
}
async function syncLearner(){
 if(!SYNC||!S.u||USERS[S.u]?.role==='admin'||document.visibilityState!=='visible')return;
 if(localStorage.getItem('mp_dirty')===S.u){flushDirty();return}
 const before=JSON.stringify(P()[S.u]||{}); await pullProg();
 const after=JSON.stringify(P()[S.u]||{});
 if(before!==after&&S.u){const u=U()[S.u];if(u){$a(learnerV(u));if(typeof S.cur==='number')mountMedia()}}
}
async function pullAll(){if(!SYNC)return;const k=akey();if(!k)return;try{const r=await api('GET',{a:'all',key:k});if(r.error){sessionStorage.removeItem('mp_k');toast('Wrong sync key');render();return}S.all=r}catch(e){toast('Could not reach server – check internet and tap Refresh')}}
let adminRefreshing=false;
async function refreshAdmin(){
 if(!SYNC||!S.u||USERS[S.u]?.role!=='admin'||S.tab!=='d'||adminRefreshing||document.visibilityState!=='visible')return;
 adminRefreshing=true;
 try{const k=akey();if(!k)return;const r=await api('GET',{a:'all',key:k});if(r.error){sessionStorage.removeItem('mp_k');toast('Wrong sync key');return}
 const changed=JSON.stringify(r)!==JSON.stringify(S.all||{});S.all=r;
 if(changed){const box=document.querySelector('.main');if(box)box.innerHTML=dashV()}
 }catch(e){}finally{adminRefreshing=false}
}
let S={u:sessionStorage.getItem('mp_s'),cur:0,fail:0,lock:0,tab:'d',d:null,iv:null};
const $a=h=>document.getElementById('app').innerHTML=h;
function parseCSV(t){t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;
 for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
  else if(c=='"')q=true;
  else if(c==','){r.push(f);f=''}
  else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
  else f+=c}
 r.push(f);if(r.some(x=>x.trim()))rows.push(r);return rows}
async function boot(){try{const res=await fetch('users.csv?'+Date.now(),{cache:'no-store'});if(!res.ok)throw 0;
  parseCSV(await res.text()).slice(1).forEach(r=>{const id=(r[0]||'').trim().toLowerCase();if(id&&r[2])USERS[id]={name:(r[1]||id).trim(),pw:r[2].trim(),role:(r[3]||'user').trim().toLowerCase()==='admin'?'admin':'user'}});
  if(!Object.keys(USERS).length)throw 0}
 catch(e){CSVERR='users.csv not found or empty. Upload it to the same folder as index.html and open the site via GitHub Pages (not by double-clicking the file).'}
 render();
 if(SYNC){(async()=>{try{const c=await api('GET',{a:'cfg'});if(c&&c.sections)localStorage.setItem('mp_cfg',JSON.stringify(c))}catch(e){}
  await pullProg();if(S.u&&USERS[S.u]?.role!=='admin'){flushDirty();render()}})()}
 if(SYNC){clearInterval(S.syncTimer);S.syncTimer=setInterval(()=>{if(!S.u)return;if(USERS[S.u]?.role==='admin')refreshAdmin();else syncLearner()},4000);
 document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.u){if(USERS[S.u]?.role==='admin')refreshAdmin();else syncLearner()}})}
}
async function okPw(u,p){return u.pw.startsWith('sha256:')?u.pw.slice(7).toLowerCase()===await H(p):u.pw===p}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2500)}
const hdr=n=>`<header><div class="logo"><i>M</i>MICRO PLASTICS PVT LTD</div><div>${n?esc(n)+' &nbsp; <button class="btn s sm" onclick="logout()">Logout</button>':''}</div></header>`;
function render(){clearInterval(S.iv);const u=U()[S.u];
 if(!u){S.u=null;sessionStorage.removeItem('mp_s');return $a(loginV())}
 if(u.role==='admin'){$a(adminV(u));if(SYNC&&S.tab==='d'&&!S.all)pullAll().then(()=>S.all&&render());return}
 $a(learnerV(u));if(typeof S.cur==='number')mountMedia()}

/* ---------- LOGIN ---------- */
function loginV(){return `<div class="login"><div class="hero"><div class="logo" style="font-size:20px"><i>M</i>MICRO PLASTICS PRIVATE LIMITED</div>
<h1>Employee Training Portal</h1><p>Complete your section-wise training videos, pass the final assessment and download your certificate.</p>
<ul><li>▶ Sequential video modules</li><li>✔ Final assessment (pass mark ${C().passMark}%)</li><li>🎓 Certificate on completion</li></ul></div>
<div class="lbox"><form onsubmit="login(event)"><h2 style="margin-top:0;color:var(--navy)">Sign in</h2><label class="l">User ID</label><input id="uid" autocomplete="username" required>
<label class="l">Password</label><input id="pw" type="password" autocomplete="current-password" required><div class="err" id="er">${esc(CSVERR)}</div><button class="btn" style="width:100%">Login</button>
<p class="mu" style="text-align:center">Forgot password? Contact your administrator.</p></form></div></div>`}
async function login(e){e.preventDefault();const er=document.getElementById('er');
 if(Date.now()<S.lock)return er.textContent='Too many attempts. Wait '+Math.ceil((S.lock-Date.now())/1000)+'s.';
 const id=uid.value.trim().toLowerCase(),u=U()[id];
 if(u&&await okPw(u,pw.value)){S.u=id;S.fail=0;S.cur=0;S.tab='d';S.d=null;S.all=null;sessionStorage.setItem('mp_s',id);await pullProg();render();flushDirty()}
 else{if(++S.fail>=5){S.lock=Date.now()+30000;S.fail=0}er.textContent='Invalid User ID or password.'}}
function logout(){clearInterval(S.syncTimer);S.u=null;S.d=null;sessionStorage.removeItem('mp_s');render()}

/* ---------- MEDIA ---------- */
function embed(src){src=src||'';const d=src.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?id=)([\w-]+)/)||(/drive\.google/.test(src)&&src.match(/[?&]id=([\w-]+)/));
 if(d)return{f:1,u:`https://drive.google.com/file/d/${d[1]}/preview`};
 const y=src.match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);if(y)return{f:1,u:`https://www.youtube.com/embed/${y[1]}?rel=0`};
 return{f:0,u:src}}
function saveWatch(id,w){const a=P();a[S.u]=a[S.u]||{done:{}};a[S.u].watch=a[S.u].watch||{};a[S.u].watch[id]=w;localStorage.setItem('mp_prog',JSON.stringify(a));pushProg()}
function mountMedia(){const s=C().sections[S.cur];if(!s||P()[S.u]?.done?.[s.id])return;
 if(embed(s.src).f){const need=(s.mins||1)*60;let w=P()[S.u]?.watch?.[s.id]||0;
  const tick=()=>{const left=Math.max(0,need-w),t=document.getElementById('tm'),b=document.getElementById('mk');if(!t)return;
   t.textContent=left?`Time remaining: ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'✓ You may now complete this section';b.disabled=left>0};
  tick();S.iv=setInterval(()=>{if(document.visibilityState!=='visible')return;if(w<need)w++;if(w%5===0||w>=need)saveWatch(s.id,w);tick()},1000)}
 else{const v=document.getElementById('vid');let mx=0;
  v.ontimeupdate=()=>{if(!v.seeking&&v.currentTime>mx)mx=v.currentTime};v.onseeking=()=>{if(v.currentTime>mx+1)v.currentTime=mx};v.onended=mark;
  v.onerror=()=>document.getElementById('vmsg').textContent='Video could not be loaded. Please inform the administrator.'}}

/* ---------- LEARNER ---------- */
function stat(id,pr=P()){const c=C(),p=pr[id]||{done:{}},n=c.sections.filter(s=>p.done?.[s.id]).length;return{n,t:c.sections.length,all:n===c.sections.length,p}}
function learnerV(u){const c=C(),{n,t,all,p}=stat(S.u),pct=Math.round(n/t*100);
 const items=c.sections.map((s,i)=>{const ok=p.done?.[s.id],lk=i>0&&!p.done?.[c.sections[i-1].id]&&!ok;
  return `<div class="item ${S.cur===i?'on':''} ${lk?'lk':''}" onclick="go(${i})"><span class="dot ${ok?'ok':''}">${ok?'✓':i+1}</span>${esc(s.title)}</div>`}).join('');
 const as=`<div class="item ${S.cur==='a'?'on':''} ${all?'':'lk'}" onclick="go('a')"><span class="dot ${p.cert?'ok':''}">${p.cert?'✓':'★'}</span>Final Assessment</div>
 <div class="item ${S.cur==='c'?'on':''} ${p.cert?'':'lk'}" onclick="go('c')"><span class="dot">🎓</span>Certificate</div>`;
 let m='';
 if(typeof S.cur==='number'){const s=c.sections[S.cur],ok=p.done?.[s.id],e=embed(s.src),nx=S.cur+1<t?S.cur+1:"'a'";
  m=`<h2 style="margin-top:0">${S.cur+1}. ${esc(s.title)}</h2><p class="mu">${esc(s.desc)}</p>
  ${!s.src?'<p class="err">Video not added yet by the administrator.</p>':e.f?`<iframe class="v" src="${esc(e.u)}" allow="autoplay;fullscreen" allowfullscreen></iframe>`:`<video id="vid" controls controlsList="nodownload noplaybackrate" disablePictureInPicture oncontextmenu="return false" src="${esc(e.u)}"></video>`}
  ${ok?`<p class="mu">✓ Completed</p><button class="btn" onclick="go(${nx})">Next →</button>`
   :e.f?`<div class="timer"><span id="tm"></span><button class="btn" id="mk" disabled onclick="mark()">Mark section complete</button></div><p class="mu">Play the video above. The timer runs only while this tab is open and visible.</p>`
   :`<p class="mu" id="vmsg">Watch the full video to complete this section. Skipping ahead is disabled.</p>`}`}
 else if(S.cur==='a')m=assessV(c,p);
 else if(S.cur==='c'&&p.cert)m=`${certHTML(c,u.name,p.cert,S.u)}<p><button class="btn" onclick="print()">Print / Save as PDF</button></p>`;
 return hdr(u.name)+`<div class="wrap"><aside class="side"><b>${esc(c.course)}</b><div class="bar"><b style="width:${pct}%"></b></div><div class="mu" style="margin:-8px 0 12px">${n}/${t} sections · ${pct}%</div>${items}${as}</aside><main class="main">${m}</main></div>`}
function go(i){const c=C(),p=P()[S.u]||{done:{}};
 if(typeof i==='number'&&i>0&&!p.done?.[c.sections[i-1].id]&&!p.done?.[c.sections[i].id])return;
 if(i==='a'&&!stat(S.u).all)return;if(i==='c'&&!p.cert)return;S.cur=i;render()}
function mark(){const s=C().sections[S.cur],a=P();a[S.u]=a[S.u]||{done:{}};if(a[S.u].done[s.id])return;a[S.u].done[s.id]=Date.now();W('mp_prog',a);pushProg();toast('Section completed ✓');render()}
function assessV(c,p){const best=Math.max(0,...(p.tries||[]).map(t=>t.score));
 if(p.cert)return `<h2 style="margin-top:0">Assessment passed ✓</h2><p>Best score: <b>${best}%</b>.</p><button class="btn" onclick="go('c')">View Certificate</button>`;
 return `<h2 style="margin-top:0">Final Assessment</h2><p class="mu">${c.questions.length} questions · Pass mark ${c.passMark}% · Unlimited attempts${p.tries?.length?` · Last: ${p.tries.at(-1).score}%`:''}</p>
 <form onsubmit="submitA(event)">${c.questions.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${q.o.filter(o=>o).map(o=>[o,q.o.indexOf(o)]).map(([o,j])=>`<label><input type="radio" name="q${i}" value="${j}" required>${esc(o)}</label>`).join('')}</div>`).join('')}<button class="btn">Submit Assessment</button></form>`}
function submitA(e){e.preventDefault();const c=C(),f=new FormData(e.target);let r=0;c.questions.forEach((q,i)=>{if(+f.get('q'+i)===q.a)r++});
 const score=Math.round(r/c.questions.length*100),a=P();a[S.u].tries=a[S.u].tries||[];a[S.u].tries.push({score,date:Date.now()});
 const pass=score>=c.passMark;if(pass)a[S.u].cert={id:'MPPL-'+new Date().getFullYear()+'-'+crypto.getRandomValues(new Uint32Array(1))[0].toString(16).toUpperCase().slice(0,6),date:Date.now(),score};
 W('mp_prog',a);pushProg();toast(pass?'Passed with '+score+'%':'Scored '+score+'%. Please retry.');S.cur=pass?'c':'a';render()}
function certHTML(c,name,ce,emp){const k=c.cert,d=new Date(ce.date).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});
 const body=esc(k.body).split('{course}').join(esc(c.course)).split('{score}').join(ce.score);
 return `<div class="cert" style="border-color:${esc(k.color)}">${k.logo?`<img src="${k.logo}" alt="">`:''}<div class="org" style="color:${esc(k.color)}">${esc(k.org)}</div>
 <h1 style="color:${esc(k.color)}">${esc(k.title)}</h1><p>${esc(k.sub)}</p><h2>${esc(name)}</h2><p>${body}</p>
 <div class="sg"><b>${esc(k.sign)}</b><br><small>${esc(k.desig)}</small></div>
 <p class="mu">Date: ${d} &nbsp;|&nbsp; Certificate ID: ${esc(ce.id)} &nbsp;|&nbsp; Employee ID: ${esc(emp)}</p><p class="mu" style="font-size:12px">${esc(k.footer)}</p></div>`}

/* ---------- ADMIN ---------- */
const TABS=[['d','Dashboard'],['s','Sections & Videos'],['q','Questions'],['c','Certificate'],['x','Settings']];
function adminV(u){if(!S.d)S.d=JSON.parse(JSON.stringify(C()));const D=S.d;let b='';
 if(S.tab==='d')b=dashV();
 if(S.tab==='s')b=`<p class="mu">Paste the Google Drive share link for each video. In Drive: right-click video → Share → General access: <b>Anyone with the link</b> → Copy link. YouTube (unlisted) and direct .mp4 links also work. "Minimum minutes" is how long the learner must stay on the section before it can be marked complete (set it to the video length).</p>`+
  D.sections.map((s,i)=>`<div class="ed"><div class="row"><b>Section ${i+1}</b><span style="flex:1"></span><button class="btn s sm" onclick="mv('sections',${i},-1)">↑</button><button class="btn s sm" onclick="mv('sections',${i},1)">↓</button><button class="btn d sm" onclick="del('sections',${i})">Delete</button></div>
  <label class="l">Title</label><input value="${esc(s.title)}" oninput="S.d.sections[${i}].title=this.value">
  <label class="l">Description</label><input value="${esc(s.desc)}" oninput="S.d.sections[${i}].desc=this.value">
  <div class="g2"><div><label class="l">Video link (Google Drive)</label><input value="${esc(s.src)}" placeholder="https://drive.google.com/file/d/.../view" oninput="S.d.sections[${i}].src=this.value"></div>
  <div><label class="l">Minimum minutes to complete</label><input type="number" min="1" value="${s.mins||1}" oninput="S.d.sections[${i}].mins=+this.value"></div></div></div>`).join('')+
  `<button class="btn s" onclick="add('sections')">+ Add section</button> <button class="btn" onclick="saveD()">Save changes</button>`;
 if(S.tab==='q')b=`<p class="mu">Enter the question, four options, and choose the correct answer. Pass mark is set under Settings.</p>`+
  D.questions.map((q,i)=>`<div class="ed"><div class="row"><b>Question ${i+1}</b><span style="flex:1"></span><button class="btn s sm" onclick="mv('questions',${i},-1)">↑</button><button class="btn s sm" onclick="mv('questions',${i},1)">↓</button><button class="btn d sm" onclick="del('questions',${i})">Delete</button></div>
  <input value="${esc(q.q)}" placeholder="Question text" oninput="S.d.questions[${i}].q=this.value">
  <div class="g2">${[0,1,2,3].map(j=>`<input value="${esc(q.o[j]||'')}" placeholder="Option ${'ABCD'[j]}" oninput="S.d.questions[${i}].o[${j}]=this.value">`).join('')}</div>
  <label class="l">Correct answer</label><select onchange="S.d.questions[${i}].a=+this.value">${[0,1,2,3].map(j=>`<option value="${j}" ${q.a===j?'selected':''}>Option ${'ABCD'[j]}</option>`).join('')}</select></div>`).join('')+
  `<button class="btn s" onclick="add('questions')">+ Add question</button> <button class="btn" onclick="saveD()">Save changes</button>`;
 if(S.tab==='c'){const k=D.cert,f=(l,key,ta)=>`<label class="l">${l}</label>${ta?`<textarea rows="3" onchange="S.d.cert.${key}=this.value;render()">${esc(k[key])}</textarea>`:`<input value="${esc(k[key])}" onchange="S.d.cert.${key}=this.value;render()">`}`;
  b=`<p class="mu">Certificate is issued automatically when a learner completes all sections and passes the assessment. In the text you can use <b>{course}</b> and <b>{score}</b>.</p>
  <div class="g2"><div>${f('Organisation name','org')}${f('Heading','title')}${f('Line above name','sub')}${f('Main text','body',1)}${f('Signatory name / title','sign')}${f('Designation','desig')}${f('Footer note','footer')}
  <label class="l">Theme colour</label><input type="color" value="${esc(k.color)}" onchange="S.d.cert.color=this.value;render()" style="height:44px">
  <label class="l">Logo (PNG/JPG, under 300 KB)</label><input type="file" accept="image/*" onchange="logo(this)">${k.logo?'<button class="btn s sm" onclick="S.d.cert.logo=\'\';render()">Remove logo</button>':''}</div>
  <div><b>Live preview</b>${certHTML(D,'Sample Employee Name',{id:'MPPL-2026-ABC123',date:Date.now(),score:90},'EMP001')}</div></div><br><button class="btn" onclick="saveD()">Save changes</button>`}
 if(S.tab==='x')b=`<div class="g2"><div><label class="l">Course name</label><input value="${esc(D.course)}" oninput="S.d.course=this.value"><label class="l">Pass mark (%)</label><input type="number" min="1" max="100" value="${D.passMark}" oninput="S.d.passMark=+this.value">
  <button class="btn" onclick="saveD()">Save changes</button></div><div><b>Backup</b><p class="mu">Course data is stored in this browser. Export a backup file, or import one on another computer.</p>
  <button class="btn s" onclick="expC()">Export course</button> <input type="file" accept=".json" onchange="impC(this)" style="margin-top:10px"><hr><b>Protect passwords (recommended)</b><p class="mu">Paste your users.csv here (with header). Plain passwords are converted to hashed form so they are not readable in the public file. Replace users.csv on GitHub with the downloaded file.</p>
  <textarea id="hin" rows="5" placeholder="userid,username,password,role&#10;admin,Administrator,Admin@123,admin"></textarea><button class="btn s" onclick="hashCsv()">Convert &amp; download users.csv</button></div></div>`;
 return hdr(u.name)+`<div style="max-width:1200px;margin:20px auto;padding:0 16px"><h2 style="color:var(--navy);margin-bottom:0">Admin Panel</h2><div class="tabs">${TABS.map(([k,l])=>`<button class="${S.tab===k?'on':''}" onclick="S.tab='${k}';render()">${l}</button>`).join('')}</div><div class="main">${b}</div></div>`}
function dashV(){const us=U(),pr=S.all||P();let rows='',done=0,prog=0,none=0;
 if(SYNC&&!akey())return `<div style="max-width:420px"><h3 style="color:var(--navy)">Enter Admin Sync Key</h3><p class="mu">This key lets the dashboard read learner progress from the server.</p><input id="akin" type="password" placeholder="Admin Sync Key" autocomplete="off"><button class="btn" style="margin-top:10px" onclick="saveKey()">Open dashboard</button></div>`;
 Object.entries(us).filter(([k,v])=>v.role!=='admin').forEach(([id,v])=>{const s=stat(id,pr),ce=pr[id]?.cert,b=Math.max(0,...(pr[id]?.tries||[]).map(t=>t.score));
  if(ce)done++;else if(s.n)prog++;else none++;
  rows+=`<tr><td>${esc(id)}</td><td>${esc(v.name)}</td><td>${s.n}/${s.t}</td><td>${pr[id]?.tries?.length?b+'%':'–'}</td><td><span class="tag ${ce?'t1':s.n?'t2':'t3'}">${ce?'Certified':s.n?'In progress':'Not started'}</span>${pr[id]?.history?.length?`<br><small class="mu">Previous completions: ${pr[id].history.length}</small>`:''}</td><td>${ce?new Date(ce.date).toLocaleDateString():'–'}</td>
  <td><button class="btn s sm" data-id="${esc(id)}" onclick="retrain([this.dataset.id])">Retrain</button></td></tr>`});
 return `${SYNC?'':'<p class="err">⚠ Sync is not configured – progress is saved only in each device\'s own browser. See setup steps.</p>'}<div class="cards" style="margin-top:0"><div class="card"><b>${done+prog+none}</b>Total learners</div><div class="card"><b style="color:var(--ok)">${done}</b>Completed &amp; certified</div><div class="card"><b>${prog}</b>In progress</div><div class="card"><b>${none}</b>Not started</div></div>
 <div class="row"><b style="flex:1">Learner progress · live refresh every 4 seconds</b><button class="btn s sm" onclick="S.all=null;render()">↻ Refresh</button> <button class="btn d sm" onclick="retrain(Object.keys(U()).filter(k=>U()[k].role!=='admin'))">Retrain all</button> <button class="btn s sm" onclick="csv()">Export CSV</button></div><div style="overflow:auto"><table><tr><th>User ID</th><th>Name</th><th>Sections</th><th>Best score</th><th>Status</th><th>Certified on</th><th>Actions</th></tr>${rows||'<tr><td colspan=7 class="mu">No learners yet.</td></tr>'}</table></div>
 <p class="mu" style="margin-top:16px">Learner list comes from <b>users.csv</b> in your GitHub repo. To add, remove or change learners or passwords, edit that file and commit it.</p>`}
function add(a){S.d[a].push(a==='sections'?{id:'s'+Date.now(),title:'New section',desc:'',src:'',mins:5}:{q:'',o:['','','',''],a:0});render()}
function del(a,i){if(S.d[a].length<2)return toast('At least one is required');if(confirm('Delete?')){S.d[a].splice(i,1);render()}}
function mv(a,i,d){const j=i+d,A=S.d[a];if(j<0||j>=A.length)return;[A[i],A[j]]=[A[j],A[i]];render()}
function saveD(){const D=S.d;if(D.questions.some(q=>!q.q.trim()||!q.o[D.questions.indexOf(q)>-1?q.a:0]?.trim()))return toast('Fill all questions and the correct option');
 if(D.sections.some(s=>!s.title.trim()))return toast('Every section needs a title');W('mp_cfg',D);if(SYNC)api('POST',{a:'cfg',key:akey(),d:D}).then(r=>toast(r.ok?'Saved & published to all devices ✓':'Wrong sync key – not published')).catch(()=>toast('Saved locally; server unreachable'));else toast('Saved ✓ (this browser only)')}
function logo(el){const f=el.files[0];if(!f)return;if(f.size>3e5)return toast('Logo too large (max 300 KB)');const r=new FileReader();r.onload=()=>{S.d.cert.logo=r.result;render()};r.readAsDataURL(f)}
async function hashCsv(){const R=parseCSV(hin.value);if(R.length<2)return toast('Paste CSV including header row');const out=[R[0]];
 for(const r of R.slice(1)){if(r[2]&&!r[2].trim().startsWith('sha256:'))r[2]='sha256:'+await H(r[2].trim());out.push(r)}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='users.csv';a.click()}
function expC(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S.d,null,1)],{type:'application/json'}));a.download='course-backup.json';a.click()}
function impC(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const c=JSON.parse(r.result);if(!c.sections||!c.questions)throw 0;S.d={...DEF,...c,cert:{...DEF.cert,...c.cert}};toast('Imported – click Save changes');render()}catch(e){toast('Invalid file')}};r.readAsText(f)}


async function retrain(ids){if(!ids.length)return toast('No learners');
 if(SYNC&&!akey())return toast('Enter the Admin Sync Key on the dashboard first');
 if(!confirm(ids.length>1?`Restart training from Section 1 for ALL ${ids.length} learners? Current progress and certificates will be cleared (past completions are kept in history).`:`Restart training for ${ids[0]} from Section 1? Current progress and certificate will be cleared (kept in history).`))return;
 const base=S.all||P(),l=P(),t=Date.now();
 for(const id of ids){const o=base[id]||{},n={done:{},tries:[],watch:{},retrain:t,history:[...(o.history||[]),...(o.cert?[{cert:o.cert}]:[])]};l[id]=n;
  if(SYNC){try{const r=await api('POST',{a:'prog',u:id,d:n,key:akey()});if(r.error){sessionStorage.removeItem('mp_k');return toast('Wrong sync key')}}catch(e){return toast('Server unreachable')}}}
 W('mp_prog',l);toast('Training restarted from Section 1');S.all=null;render()}


function csv(){const us=U(),pr=S.all||P(),L=[['UserID','Name','Sections done','Best score','Status','Certificate ID','Certified on','Previous completions']];
 Object.entries(us).filter(([k,v])=>v.role!=='admin').forEach(([id,v])=>{const s=stat(id,pr),ce=pr[id]?.cert;L.push([id,v.name,s.n+'/'+s.t,Math.max(0,...(pr[id]?.tries||[]).map(t=>t.score)),ce?'Certified':s.n?'In progress':'Not started',ce?.id||'',ce?new Date(ce.date).toLocaleDateString():'',pr[id]?.history?.length||0])});
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download='training-report.csv';a.click()}
boot();
</script>
</body>
